version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: unt_practicas_tesis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./init-scripts/02-migration-normalized.sql:/docker-entrypoint-initdb.d/02-migration-normalized.sql
      - ./init-scripts/03-test-data.sql:/docker-entrypoint-initdb.d/03-test-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unt_practicas_tesis"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: unt-practicas-tesis-frontend:latest
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - postgres
    command: npm run start

volumes:
  postgres_data:
