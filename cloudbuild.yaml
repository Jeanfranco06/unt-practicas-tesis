# Cloud Build Configuration para Google Cloud Run Backend
# Construye la imagen del backend usando Dockerfile.prod y la pushea a GCR

steps:
  # Paso 1: Build Backend image
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "-t"
      - "gcr.io/${PROJECT_ID}/backend:prod"
      - "-f"
      - "backend/Dockerfile.prod"
      - "--build-arg"
      - "NODE_ENV=production"
      - "./backend"

  # Paso 2: Push Backend to GCR
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    args:
      - "push"
      - "gcr.io/${PROJECT_ID}/backend:prod"

# Imágenes construidas (para Cache)
images:
  - "gcr.io/${PROJECT_ID}/backend:prod"

# Sustituciones (variables configurables)
substitutions: {}

# Timeouts
timeout: "1800s"

# Opciones de logs
logsBucket: "gs://${PROJECT_ID}_cloudbuild"

# Tags para Cloud Build
tags:
  - "backend"
  - "cloud-run"
  - "prod"
